server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name fakemart.beatconnects.com;

  ssl_certificate /etc/letsencrypt/live/fakemart.beatconnects.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fakemart.beatconnects.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 20m;

  location = / {
    return 302 /fakemart/;
  }

  location = /fakemart {
    return 301 /fakemart/;
  }

  location /fakemart/api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /fakemart/admin {
    return 301 /fakemart/admin/;
  }

  location /fakemart/admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /fakemart/admin/index.html;
    add_header Cache-Control "no-cache";
  }

  location /fakemart/admin/assets/ {
    alias /usr/share/nginx/html/admin/assets/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /fakemart/js/ {
    alias /usr/share/nginx/html/client/js/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /fakemart/css/ {
    alias /usr/share/nginx/html/client/css/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /fakemart/static/ {
    alias /usr/share/nginx/html/client/static/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location /fakemart/ {
    alias /usr/share/nginx/html/client/;
    try_files $uri $uri/ /fakemart/index.html;
    add_header Cache-Control "no-cache";
  }
}
