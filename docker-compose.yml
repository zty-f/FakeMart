services:
  mysql:
    image: mysql:8.0
    container_name: fakemart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fakepass
      MYSQL_DATABASE: fakemart
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - fakemart_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pfakepass"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: fakemart-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - fakemart_redis_data:/data

volumes:
  fakemart_mysql_data:
  fakemart_redis_data:
